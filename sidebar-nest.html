<script>
function nestSidebar(){try{
  var side=document.getElementById("quarto-sidebar"); if(!side) return;
  var links=[].slice.call(side.querySelectorAll("a.sidebar-link"));
  var txt=function(a){var m=a.querySelector(".menu-text");return m?m.textContent.trim():"";};
  var landing={};
  links.forEach(function(a){landing[txt(a)]=a;});
  links.forEach(function(a){
    var m=txt(a).match(/^(.+?) (\d+)$/); if(!m||!landing[m[1]]) return;
    var book=landing[m[1]], bli=book.closest("li"), cli=a.closest("li");
    if(!bli||!cli) return;
    var ul=bli.querySelector("ul.nest");
    if(!ul){
      ul=document.createElement("ul"); ul.className="nest"; bli.appendChild(ul);
      var b=document.createElement("button"); b.type="button"; b.className="nest-toggle";
      b.setAttribute("aria-label","Show chapters of "+m[1]);
      b.addEventListener("click",function(){bli.classList.toggle("nest-open");});
      bli.insertBefore(b,ul);
    }
    a.querySelector(".menu-text").textContent="Chapter "+m[2];
    ul.appendChild(cli);
    if(a.classList.contains("active")) bli.classList.add("nest-open");
  });
  links.forEach(function(a){
    if(a.classList.contains("active")){var li=a.closest("li"); if(li&&li.querySelector("ul.nest")) li.classList.add("nest-open");}
  });
}catch(e){if(window.console)console.warn("sidebar nest failed",e);}}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",nestSidebar);}else{nestSidebar();}
</script>

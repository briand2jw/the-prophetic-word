<script>
(function(){
function safe(fn){try{fn();}catch(e){if(window.console)console.warn("nav helper failed",e);}}
function run(){
  var d=document, esc=function(t){var e=d.createElement("div");e.textContent=t;return e.innerHTML;};
  var root=location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"");
  safe(function(){
    var s=d.querySelector('script[src*="site_libs/"],link[href*="site_libs/"]');
    if(s){var at=s.getAttribute("src")||s.getAttribute("href");
      root=new URL((at.split("site_libs/")[0])||"./",location.href).href;}
  });
  var homeUrl=root+"index.html";
  var lock='<span class="lk-rule" aria-hidden="true"></span><span class="lk-word">The Truth</span><span class="lk-rule" aria-hidden="true"></span>';
  var crumbs=[],section=null,book=null;
  safe(function(){
    var ol=d.querySelector("ol.breadcrumb");
    if(ol){[].forEach.call(ol.querySelectorAll("li.breadcrumb-item"),function(li){
      var a=li.querySelector("a");crumbs.push({text:li.textContent.replace(/\s+/g," ").trim(),href:a?a.href:null});});}
    crumbs=crumbs.filter(function(c){return c.text&&c.text!=="Home";});
    var m=location.pathname.match(/\/chapters\/([^\/]+)\.html$/);
    if(m){var mm=m[1].match(/^(.*)-(\d+)$/);
      if(mm){var name=mm[1].split("-").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
        book={text:name,href:new URL("../"+mm[1]+".html",location.href).href};}}
    section=crumbs.length?crumbs[0]:null;
  });
  /* Logo (links Home) in the phone / tablet top bar, and beside the name in the sidebar */
  safe(function(){
    var bar=d.querySelector(".quarto-secondary-nav > .container-fluid, .quarto-secondary-nav");
    if(bar){
      var a=d.createElement("a");a.className="bar-logo";a.href=homeUrl;a.setAttribute("aria-label","The Truth, go to Home");
      a.innerHTML=lock;
      var tg=bar.querySelector("button.quarto-btn-toggle, button[data-bs-toggle]");
      if(tg&&tg.parentNode===bar)tg.insertAdjacentElement("afterend",a);else bar.insertBefore(a,bar.firstChild);
      d.documentElement.classList.add("nav-enhanced");
    }
  });
  safe(function(){
    var t=d.querySelector("#quarto-sidebar .sidebar-title a");
    if(t&&!t.querySelector(".lk-word")){t.classList.add("logo-lockup");t.setAttribute("aria-label","The Truth, go to Home");t.innerHTML=lock;}
  });
  /* Return links at the bottom of each page */
  safe(function(){
    var main=d.querySelector("main.content");
    var here=location.href.split(/[?#]/)[0];
    if(!main||here===root||here===homeUrl)return;
    var links=[];
    if(book)links.push({t:"↑ Back to "+book.text,h:book.href});
    if(section)links.push({t:section.text,h:section.href});
    links.push({t:"Home",h:homeUrl});
    var seen={};links=links.filter(function(l){if(!l.h||seen[l.h]||l.h===here)return false;seen[l.h]=1;return true;});
    if(!links.length)return;
    var r=d.createElement("nav");r.className="return-links";r.setAttribute("aria-label","Return to");
    r.innerHTML=links.map(function(l){return '<a href="'+l.h+'">'+esc(l.t)+'</a>';}).join("");
    main.appendChild(r);
  });
  /* Browser-tab icon and home-screen icon */
  safe(function(){
    [["icon","image/png"],["apple-touch-icon",""]].forEach(function(r){
      var l=d.createElement("link");l.rel=r[0];if(r[1])l.type=r[1];l.href=root+"logo.png";d.head.appendChild(l);});
  });
  /* Back-to-top button */
  safe(function(){
    var b=d.createElement("button");b.type="button";b.className="to-top";b.setAttribute("aria-label","Back to top");b.innerHTML="↑";
    b.addEventListener("click",function(){var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;window.scrollTo({top:0,behavior:rm?"auto":"smooth"});});
    d.body.appendChild(b);
    var tick=false;function chk(){b.classList.toggle("show",window.scrollY>700);tick=false;}
    window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(chk);}},{passive:true});chk();
  });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
})();
</script>

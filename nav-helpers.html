<script>
(function(){
function safe(fn){try{fn();}catch(e){if(window.console)console.warn("nav helper failed",e);}}
function run(){
  var d=document, esc=function(t){var e=d.createElement("div");e.textContent=t;return e.innerHTML;};
  var root=location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"");
  safe(function(){
    var s=d.querySelector('script[src*="site_libs/"],link[href*="site_libs/"]');
    if(s){var at=s.getAttribute("src")||s.getAttribute("href");
      root=new URL((at.split("site_libs/")[0])||"./",location.href).href;}
  });
  var homeUrl=root+"index.html";
  var lock='<span class="lk-rule" aria-hidden="true"></span><span class="lk-word"><span>The</span><span>Truth</span></span><span class="lk-rule" aria-hidden="true"></span>';
  var crumbs=[],section=null,book=null;
  safe(function(){
    var ol=d.querySelector("ol.breadcrumb");
    if(ol){[].forEach.call(ol.querySelectorAll("li.breadcrumb-item"),function(li){
      var a=li.querySelector("a");crumbs.push({text:li.textContent.replace(/\s+/g," ").trim(),href:a?a.href:null});});}
    crumbs=crumbs.filter(function(c){return c.text&&c.text!=="Home";});
    var m=location.pathname.match(/\/chapters\/([^\/]+)\.html$/);
    if(m){var mm=m[1].match(/^(.*)-(\d+)$/);
      if(mm){var name=mm[1].split("-").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
        book={text:name,href:new URL("../"+mm[1]+".html",location.href).href};}}
    section=crumbs.length?crumbs[0]:null;
  });
  /* Logo (links Home) in the phone / tablet top bar, and beside the name in the sidebar */
  safe(function(){
    var bar=(d.querySelector(".quarto-secondary-nav > .container-fluid")||d.querySelector(".quarto-secondary-nav"));
    if(bar){
      var a=d.createElement("a");a.className="bar-logo";a.href=homeUrl;a.setAttribute("aria-label","The Truth, go to Home");
      a.innerHTML=lock;
      var tg=bar.querySelector("button.quarto-btn-toggle, button[data-bs-toggle]");
      if(tg&&tg.parentNode===bar)tg.insertAdjacentElement("afterend",a);else bar.insertBefore(a,bar.firstChild);
      d.documentElement.classList.add("nav-enhanced");
    }
  });
  safe(function(){
    var t=d.querySelector("#quarto-sidebar .sidebar-title a");
    if(t&&!t.querySelector(".lk-word")){t.classList.add("logo-lockup");t.setAttribute("aria-label","The Truth, go to Home");t.innerHTML=lock;}
  });
  /* EPUB download: move to the bottom of the menu, with a label */
  safe(function(){
    var host=d.querySelector("#quarto-sidebar .sidebar-menu-container")||d.querySelector("#quarto-sidebar");
    if(!host||d.querySelector(".epub-side"))return;
    var a=d.createElement("a");a.className="epub-side";a.href=root+"the-truth.epub";a.setAttribute("download","");
    a.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 3v12M7 11l5 5 5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download EPUB</span>';
    var w=d.createElement("div");w.className="epub-side-wrap";w.appendChild(a);host.appendChild(w);
    d.documentElement.classList.add("epub-moved");
  });
  /* Chapter pages: previous / next stay inside the same Bible book */
  safe(function(){
    var m=location.pathname.match(/\/chapters\/(.+)-(\d+)\.html$/);
    var main=d.querySelector("main.content");
    if(!m||!main)return;
    var slug=m[1],cur=parseInt(m[2],10),list=[];
    [].forEach.call(d.querySelectorAll('a.sidebar-link[href*="chapters/"]'),function(a){
      var u=a.href.split(/[?#]/)[0],mm=u.match(/\/chapters\/(.+)-(\d+)\.html$/);
      if(!mm||mm[1]!==slug)return;var n=parseInt(mm[2],10);
      if(!list.some(function(x){return x.n===n;}))list.push({n:n,href:u});
    });
    list.sort(function(a,b){return a.n-b.n;});
    var i=-1;list.forEach(function(x,k){if(x.n===cur)i=k;});
    if(i<0)return;
    var name=slug.split("-").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
    var bookUrl=new URL("../"+slug+".html",location.href).href;
    var prev=list[i-1],next=list[i+1];
    var nav=d.createElement("nav");nav.className="chapter-pager";nav.setAttribute("aria-label","Chapters in "+name);
    nav.innerHTML=
      (prev?'<a class="cp-prev" href="'+prev.href+'"><span class="cp-arrow">\u2039</span><span>'+esc(name+" "+prev.n)+'</span></a>'
           :'<a class="cp-prev" href="'+bookUrl+'"><span class="cp-arrow">\u2039</span><span>All of '+esc(name)+'</span></a>')+
      (next?'<a class="cp-next" href="'+next.href+'"><span>'+esc(name+" "+next.n)+'</span><span class="cp-arrow">\u203A</span></a>':'');
    main.appendChild(nav);
    d.documentElement.classList.add("chapter-page");
  });
  /* Installable web app: manifest, offline script, Android install button */
  safe(function(){
    var head=d.head;
    var l=d.createElement("link");l.rel="manifest";l.href=root+"manifest.webmanifest";head.appendChild(l);
    [["apple-mobile-web-app-capable","yes"],["apple-mobile-web-app-title","The Truth"],["apple-mobile-web-app-status-bar-style","black-translucent"],["theme-color","#1b1c18"]].forEach(function(p){
      var m=d.createElement("meta");m.name=p[0];m.content=p[1];head.appendChild(m);});
    if("serviceWorker" in navigator){window.addEventListener("load",function(){
      navigator.serviceWorker.register(root+"sw.js",{scope:root}).catch(function(){});});}
    var deferred=null,btn=d.getElementById("install-btn");
    window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(btn)btn.hidden=false;});
    if(btn)btn.addEventListener("click",function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;btn.hidden=true;});});
    window.addEventListener("appinstalled",function(){if(btn)btn.hidden=true;});
    if(window.matchMedia("(display-mode: standalone)").matches||navigator.standalone){
      [].forEach.call(d.querySelectorAll(".install-box"),function(b){b.hidden=true;});}
  });
  /* "How do I install this?" prompt on Home */
  safe(function(){
    var b=d.getElementById("howto-btn");if(!b||typeof HTMLDialogElement==="undefined")return;
    var dlg=d.createElement("dialog");dlg.id="install-dialog";dlg.setAttribute("aria-labelledby","in-title");
    dlg.innerHTML='<div class="dlg"><h2 id="in-title">Install this website as an app</h2>'+
      '<h3>iPhone or iPad (Safari)</h3><ol><li>Tap the Share button (the square with an arrow pointing up).</li><li>Scroll down and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>'+
      '<h3>Android (Chrome)</h3><ol><li>Tap the menu (three dots) at the top right.</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Tap <strong>Install</strong>.</li></ol>'+
      '<p>The app opens from your home screen like any other app.</p>'+
      '<button type="button" class="dlg-close">Close</button></div>';
    d.body.appendChild(dlg);
    b.addEventListener("click",function(){dlg.showModal();});
    dlg.querySelector(".dlg-close").addEventListener("click",function(){dlg.close();});
    dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});
  });
  /* Return links at the bottom of each page */
  safe(function(){
    var main=d.querySelector("main.content");
    var here=location.href.split(/[?#]/)[0];
    if(!main||here===root||here===homeUrl)return;
    var links=[];
    if(book)links.push({t:"↑ Back to "+book.text,h:book.href});
    if(section)links.push({t:section.text,h:section.href});
    links.push({t:"Home",h:homeUrl});
    var seen={};links=links.filter(function(l){if(!l.h||seen[l.h]||l.h===here)return false;seen[l.h]=1;return true;});
    if(!links.length)return;
    var r=d.createElement("nav");r.className="return-links";r.setAttribute("aria-label","Return to");
    r.innerHTML=links.map(function(l){return '<a href="'+l.h+'">'+esc(l.t)+'</a>';}).join("");
    main.appendChild(r);
  });
  /* Translate: button in the menu and at the top of Home, opening a how-to dialog */
  safe(function(){
    var globe='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>';
    var dlg=d.createElement("dialog");dlg.id="translate-dialog";dlg.setAttribute("aria-labelledby","tr-title");
    dlg.innerHTML='<div class="dlg"><h2 id="tr-title">Read this page in your language</h2><p>Your web browser can translate this page for you, usually with Google Translate. Choose the steps for your device. The exact wording can vary by browser version.</p><h3>Chrome on a computer</h3><p>Click the translate icon at the right end of the address bar, then choose your language. If you don\u2019t see it, right-click the page and choose \u201cTranslate to\u2026\u201d.</p><h3>Chrome on an iPhone, iPad or Android phone</h3><p>Open the browser menu and tap \u201cTranslate\u2026\u201d, then pick your language.</p><h3>Safari on an iPhone or iPad</h3><p>Tap the \u201caA\u201d button at the left of the address bar and choose \u201cTranslate to\u2026\u201d.</p><h3>Microsoft Edge</h3><p>Click the translate icon in the address bar and choose your language.</p><h3>Any other browser</h3><p>Go to translate.google.com, open the Websites tab, paste this page\u2019s address, and choose your language.</p><button type="button" class="dlg-close">Close</button></div>';
    d.body.appendChild(dlg);
    var open=function(){if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");};
    var close=function(){if(typeof dlg.close==="function")dlg.close();else dlg.removeAttribute("open");};
    dlg.querySelector(".dlg-close").addEventListener("click",close);
    dlg.addEventListener("click",function(e){if(e.target===dlg)close();});
    function mk(cls){var b=d.createElement("button");b.type="button";b.className="translate-btn "+cls;b.setAttribute("aria-haspopup","dialog");b.innerHTML=globe+"<span>Translate</span>";b.addEventListener("click",open);return b;}
    var wrap=d.querySelector(".epub-side-wrap");
    if(wrap){wrap.insertBefore(mk("tr-side"),wrap.firstChild);}
    else{var host=d.querySelector("#quarto-sidebar .sidebar-menu-container")||d.querySelector("#quarto-sidebar");if(host){var w=d.createElement("div");w.className="epub-side-wrap";w.appendChild(mk("tr-side"));host.appendChild(w);}}
    var bar=(d.querySelector(".quarto-secondary-nav > .container-fluid")||d.querySelector(".quarto-secondary-nav"));
    if(bar){
      var tb=mk("tr-bar");tb.setAttribute("aria-label","Translate this page");tb.querySelector("span").className="sr-only";
      var sr=bar.querySelector("#quarto-search, .quarto-search, .aa-DetachedSearchButton, button[aria-label*='earch']");
      var anchor=sr;while(anchor&&anchor.parentNode!==bar)anchor=anchor.parentNode;
      if(anchor)bar.insertBefore(tb,anchor);else bar.appendChild(tb);
    }
  });
  /* Top bar: one row -> menu | logo ........ translate | search */
  safe(function(){
    var bar=(d.querySelector(".quarto-secondary-nav > .container-fluid")||d.querySelector(".quarto-secondary-nav"));
    if(!bar)return;
    bar.style.flexWrap="nowrap";bar.style.alignItems="center";
    [].forEach.call(bar.children,function(c){
      var o=3;
      if(c.classList.contains("bar-logo"))o=2;
      else if(c.classList.contains("tr-bar"))o=4;
      else if(c.matches(".quarto-btn-toggle")||c.querySelector(".quarto-btn-toggle"))o=1;
      else if(/search/i.test(c.id||"")||c.classList.contains("quarto-search")||c.querySelector(".aa-DetachedSearchButton,.aa-Autocomplete,#quarto-search"))o=5;
      c.style.order=o;
    });
  });
  /* Accent: last word of page titles and section headings in coloured italics */
  safe(function(){
    [].forEach.call(d.querySelectorAll("main.content h1.title, main.content h2"),function(h){
      if(h.classList.contains("no-hl")||h.querySelector(".hl"))return;
      var words=h.textContent.trim().split(/\s+/);if(words.length<2)return;
      var w=d.createTreeWalker(h,NodeFilter.SHOW_TEXT),last=null,n;
      while((n=w.nextNode())){if(n.nodeValue.trim())last=n;}
      if(!last)return;
      var m=last.nodeValue.match(/^([\s\S]*?)(\S+)(\s*)$/);if(!m)return;
      last.nodeValue=m[1];
      var sp=d.createElement("span");sp.className="hl";sp.textContent=m[2];
      last.parentNode.insertBefore(sp,last.nextSibling);
      if(m[3])sp.parentNode.insertBefore(d.createTextNode(m[3]),sp.nextSibling);
    });
  });
  /* Menu sections start collapsed; the section holding the current page stays open */
  safe(function(){
    [].forEach.call(d.querySelectorAll("#quarto-sidebar li.sidebar-item-section"),function(li){
      var ul=li.querySelector(":scope > ul.sidebar-section, :scope > ul");
      var tg=li.querySelector(":scope > .sidebar-item-container .sidebar-item-toggle, :scope > .sidebar-item-container [data-bs-toggle='collapse']");
      if(!ul||!tg)return;
      var holdsCurrent=!!ul.querySelector("a.sidebar-link.active");
      if(holdsCurrent)return;
      ul.classList.remove("show");
      tg.classList.add("collapsed");
      tg.setAttribute("aria-expanded","false");
    });
  });
  /* Browser-tab icon and home-screen icon */
  safe(function(){
    [["icon","image/png"],["apple-touch-icon",""]].forEach(function(r){
      var l=d.createElement("link");l.rel=r[0];if(r[1])l.type=r[1];l.href=root+(r[0]==="apple-touch-icon"?"icons/apple-touch-icon.png":"icons/icon-192.png");d.head.appendChild(l);});
  });
  /* Text size control on article and chapter pages (remembered on this device) */
  safe(function(){
    var levels=[0.9,1,1.15,1.3,1.5],idx=1;
    try{var s=parseInt(localStorage.getItem("textSize"),10);if(s>=0&&s<levels.length)idx=s;}catch(e){}
    d.documentElement.style.setProperty("--read-scale",levels[idx]);
    var dates=d.querySelector("main.content .dates");
    if(!dates)return;
    var box=d.createElement("div");box.className="text-size";
    box.innerHTML='<span class="ts-label" id="ts-label">Text size</span><button type="button" class="ts-btn" data-d="-1" aria-label="Smaller text">A\u2212</button><button type="button" class="ts-btn" data-d="1" aria-label="Larger text">A+</button>';
    dates.insertAdjacentElement("afterend",box);
    var btns=box.querySelectorAll(".ts-btn");
    function paint(){d.documentElement.style.setProperty("--read-scale",levels[idx]);
      btns[0].disabled=idx===0;btns[1].disabled=idx===levels.length-1;
      try{localStorage.setItem("textSize",String(idx));}catch(e){}}
    [].forEach.call(btns,function(b){b.addEventListener("click",function(){
      var n=idx+parseInt(b.getAttribute("data-d"),10);if(n<0||n>=levels.length)return;idx=n;paint();});});
    paint();
  });
  /* Back-to-top button */
  safe(function(){
    var b=d.createElement("button");b.type="button";b.className="to-top";b.setAttribute("aria-label","Back to top");b.innerHTML="↑";
    b.addEventListener("click",function(){var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;window.scrollTo({top:0,behavior:rm?"auto":"smooth"});});
    d.body.appendChild(b);
    var tick=false;function chk(){b.classList.toggle("show",window.scrollY>700);tick=false;}
    window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(chk);}},{passive:true});chk();
  });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
})();
</script>

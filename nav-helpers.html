<script>
(function(){
function run(){
try{
  var d=document, esc=function(t){var e=d.createElement("div");e.textContent=t;return e.innerHTML;};
  /* site root */
  var s=d.querySelector('script[src*="site_libs/"],link[href*="site_libs/"]');
  var root=location.origin+"/";
  if(s){var at=s.getAttribute("src")||s.getAttribute("href");root=new URL(at.split("site_libs/")[0],location.href).href;}
  var homeUrl=root+"index.html";
  /* crumbs Quarto already knows */
  var ol=d.querySelector("ol.breadcrumb"), crumbs=[];
  if(ol){[].forEach.call(ol.querySelectorAll("li.breadcrumb-item"),function(li){
    var a=li.querySelector("a"); crumbs.push({text:li.textContent.replace(/\s+/g," ").trim(),href:a?a.href:null});});}
  crumbs=crumbs.filter(function(c){return c.text&&c.text!=="Home";});
  var isHome=/(^|\/)(index\.html)?$/.test(location.pathname.replace(/[^\/]*\/\.\.\//,"")) && root===location.href.replace(/index\.html.*$/,"").replace(/[?#].*$/,"") ;
  if(!crumbs.length && /(^\/?$)|index\.html$|\/$/.test(location.pathname) && location.href.split("?")[0].split("#")[0].replace(/index\.html$/,"")===root) isHome=true; else isHome=false;
  /* chapters: add the book between section and chapter */
  var m=location.pathname.match(/\/chapters\/([^\/]+)\.html$/);
  if(m){
    var mm=m[1].match(/^(.*)-(\d+)$/);
    if(mm){
      var book=mm[1].split("-").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
      var bookUrl=new URL("../"+mm[1]+".html",location.href).href;
      var last=crumbs.length?crumbs.pop():null;
      crumbs.push({text:book,href:bookUrl});
      crumbs.push({text:"Chapter "+mm[2],href:null});
    }
  }
  var trail=[{text:"Home",href:homeUrl}].concat(crumbs);
  var section=crumbs.length?crumbs[0]:null;
  /* section colour */
  if(section){var t=section.text.toLowerCase();
    d.documentElement.setAttribute("data-section",t.indexOf("know")>-1?"know":t.indexOf("prophetic")>-1?"prophetic":t.indexOf("seek")>-1?"seek":"");}
  /* 1. Home + section in the phone/tablet top bar */
  var bar=d.querySelector(".quarto-secondary-nav > .container-fluid, .quarto-secondary-nav");
  if(bar){
    var wrap=d.createElement("div"); wrap.className="bar-nav";
    wrap.innerHTML='<a class="bar-home" href="'+homeUrl+'" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Home</span></a>'+
      (section?'<span class="bar-section">'+esc(section.text)+'</span>':'');
    var bc=bar.querySelector('nav[aria-label="breadcrumb"]');
    if(bc&&bc.parentNode===bar) bar.insertBefore(wrap,bc); else bar.appendChild(wrap);
  }
  /* 2. "You are here" trail at the top of the page */
  var main=d.querySelector("main.content");
  if(main && !isHome && crumbs.length){
    var n=d.createElement("nav"); n.className="site-trail"; n.setAttribute("aria-label","You are here");
    var full=trail.map(function(c,i){
      return i<trail.length-1?'<li><a href="'+c.href+'">'+esc(c.text)+'</a></li>':'<li aria-current="page">'+esc(c.text)+'</li>';}).join("");
    var par=trail[trail.length-2];
    n.innerHTML='<ol class="trail-full">'+full+'</ol><a class="trail-back" href="'+par.href+'">‹ '+esc(par.text)+'</a>';
    main.insertBefore(n,main.firstChild);
  }
  /* 3. Return links at the bottom of the page */
  if(main && !isHome && crumbs.length){
    var links=[];
    if(m){links.push({t:"↑ Back to "+crumbs[crumbs.length-2].text,h:crumbs[crumbs.length-2].href});}
    if(section && !(m&&crumbs.length===2&&false)) links.push({t:section.text,h:section.href});
    links.push({t:"Home",h:homeUrl});
    var seen={}; links=links.filter(function(l){if(!l.h||seen[l.h]||l.h===location.href.split("#")[0])return false;seen[l.h]=1;return true;});
    if(links.length){
      var r=d.createElement("nav"); r.className="return-links"; r.setAttribute("aria-label","Return to");
      r.innerHTML=links.map(function(l){return '<a href="'+l.h+'">'+esc(l.t)+'</a>';}).join("");
      main.appendChild(r);
    }
  }
  /* 4. Back-to-top button */
  var b=d.createElement("button"); b.type="button"; b.className="to-top"; b.setAttribute("aria-label","Back to top"); b.innerHTML="↑";
  b.addEventListener("click",function(){var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;window.scrollTo({top:0,behavior:rm?"auto":"smooth"});});
  d.body.appendChild(b);
  var tick=false;function chk(){b.classList.toggle("show",window.scrollY>700);tick=false;}
  window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(chk);}},{passive:true});chk();
  d.documentElement.classList.add("nav-enhanced");
}catch(e){if(window.console)console.warn("nav helpers failed",e);}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
})();
</script>

name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Only this job may save translations back to the repository. The other jobs can only read.
    permissions:
      contents: write
      pages: write
    outputs:
      uploaded: ${{ steps.up.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The access token is not left on disk while Word files are converted; it is used only to save translations.
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install LibreOffice (only if a LibreOffice file was uploaded)
        run: |
          if ls submissions/*.odt >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer
          fi
      - name: Build pages and lists from the Word files
        run: python3 tools/build_site.py
        env:
          PANDOC: quarto pandoc
      - name: Translate pages that changed (needs the ANTHROPIC_API_KEY secret)
        continue-on-error: true
        run: python3 tools/translate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save new translations in the repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _translations
          if ! git diff --cached --quiet; then
            git commit -m "Update translations [skip ci]"
            URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            # If another build saved translations at the same time, keep this build's newest ones.
            if ! git pull --rebase -X theirs "$URL" main; then git rebase --abort || true; fi
            git push "$URL" HEAD:main || true
          fi
      - name: Render site and EPUB
        run: quarto render
      - name: Check the automatic links point to real pages
        run: python3 tools/check_autolinks.py _site >> build-problems.txt
      - name: Build the translated copies of the site (/es/, /hi/, /ar/)
        continue-on-error: true
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 tools/build_lang.py
      - uses: actions/configure-pages@v5
      - name: Make the redirect page for the old GitHub address
        run: python3 tools/make_redirect.py redirect-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
      - id: up
        name: Mark the site as ready to publish
        run: echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Report any files that were skipped
        run: |
          bad=0
          if [ -s build-problems.txt ]; then
            echo "These files were skipped. Everything else was published:"
            cat build-problems.txt
            bad=1
          fi
          if [ -s translation-problems.txt ]; then
            echo "Some translations need attention. The English site was still published:"
            cat translation-problems.txt
            bad=1
          fi
          exit $bad
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    if: ${{ always() && needs.build.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  cloudflare:
    permissions:
      contents: read
    needs: build
    if: ${{ always() && needs.build.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 pages project create thepurelanguage --production-branch=main || true
          npx --yes wrangler@4 pages deploy _site --project-name=thepurelanguage --branch=main --commit-dirty=true
      - name: Cloudflare keys not found
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "The Cloudflare keys are not saved in GitHub yet, so nothing was sent to Cloudflare."

project:
  type: book
  output-dir: _site
  resources:
    - logo.png
    - manifest.webmanifest
    - sw.js
    - icons

number-sections: false

book:
  title: "The Truth"
  language: en
  date: today
  date-format: "MMMM D, YYYY"
  output-file: "the-truth"
  downloads: [epub]
  search: true
  chapters:
    - index.qmd
    - whats-new.qmd
    - part: know-the-truth.qmd
      chapters:
        # AUTO:KT-START
        - articles/kt-why-study-the-bible.qmd
        - articles/kt-sample-article-title.qmd
        # AUTO:KT-END
    - part: prophetic-word.qmd
      chapters:
        # AUTO:PW-START
        - daniel.qmd
        - chapters/daniel-2.qmd
        - chapters/daniel-4.qmd
        - chapters/daniel-7.qmd
        - chapters/daniel-8.qmd
        - chapters/daniel-11.qmd
        - chapters/daniel-12.qmd
        - matthew.qmd
        - chapters/matthew-24.qmd
        - chapters/matthew-25.qmd
        # AUTO:PW-END
    - part: seek-jehovah.qmd
      chapters:
        # AUTO:SJ-START
        - articles/sj-seek-righteousness-why-important-now.qmd
        # AUTO:SJ-END

format:
  html:
    css: [style-main-38.css, style-dark.css]
    toc: false
    number-sections: false
    include-after-body: nav-helpers.html
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">
        <meta property="og:title" content="The Truth">
        <meta property="og:image" content="https://briand2jw.github.io/the-prophetic-word/logo.png">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:image" content="https://briand2jw.github.io/the-prophetic-word/logo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Display:wght@500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
  epub:
    css: epub.css
    epub-cover-image: logo.png
    toc: true
    number-sections: false
